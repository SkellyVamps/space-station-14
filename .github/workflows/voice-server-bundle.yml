name: Matching voice server development bundle
on:
  workflow_dispatch:
  push:
    branches: [feature/integrated-voice]
    paths:
      - Content.Server/**
      - Content.Client/**
      - Voice.Launcher/**
      - Voice.ClientHost/**
      - Content.Shared/**
      - Resources/**
      - Tools/voice/**
      - .github/workflows/voice-server-bundle.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build matching self-contained Linux server
        run: python Tools/voice/package_server.py
      - name: Verify authenticated startup and shutdown
        run: python Tools/voice/smoke_server.py release/voice-server/SkellySS14-voice-server-linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SkellySS14-voice-server-linux-x64
          path: release/voice-server/*
          if-no-files-found: error
          compression-level: 0
