name: Custom voice client development bundles
on:
  workflow_dispatch:
  push:
    branches: [feature/integrated-voice]
    paths:
      - Voice.ClientHost/**
      - Tools/voice/**
      - Content.Client/**
      - Content.Shared/**
      - Resources/**
      - .github/workflows/voice-client-bundles.yml
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unsigned development client
        run: python Tools/voice/package_custom_client.py --runtime ${{ matrix.runtime }}
      - name: Verify bundle and headless startup
        run: python Tools/voice/smoke_custom_client.py release/voice-client/SkellySS14-voice-dev-${{ matrix.runtime }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SkellySS14-voice-dev-${{ matrix.runtime }}
          path: release/voice-client/*
          if-no-files-found: error
          compression-level: 0
