# Colour-coded gateway portals for the Tutorial Station (Resources/Maps/tutorial.yml).
# They work like the debug map's PortalGatewayBlue: each one is linked to exactly one partner.
# One colour per department wing, so a portal's colour tells you where it leads.

- type: entity
  parent: BasePortalGateway
  id: PortalGatewayTutorialHub
  name: gold portal
  suffix: Tutorial
  description: A stable portal. Its label says where it leads.
  components:
  - type: Sprite
    color: "#f2d24b"
    layers:
    - state: portal
  - type: PointLight
    color: "#f2d24b"

